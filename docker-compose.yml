# Local development services. Start with:  docker compose up -d
services:
  # S3-compatible file storage for post images, avatars, videos and thumbnails.
  # API on :9000, web console on :9001 (minioadmin / minioadmin). Development only.
  # MinIO no longer publishes official images on Docker Hub; this is Bitnami's last
  # MinIO build (frozen, no updates). Fine for local development, not for production.
  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    restart: unless-stopped

  # Optional local PostgreSQL, for when the shared Supabase database is unavailable.
  # Start with:  docker compose --profile localdb up -d postgres
  # Then run the API with DATABASE_URL / DIRECT_URL set to
  # postgresql://postgres:postgres@localhost:5433/mobilesocial (shell env wins over .env).
  postgres:
    image: postgres:17-alpine
    profiles: ["localdb"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mobilesocial
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  minio-data:
  postgres-data:
